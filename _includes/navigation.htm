<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="#">Dan Rodrigues</a> <span class="mr-2 pr-2 text-white">|</span>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mr-auto">
            {% for navLink in site.data.pages %}
                {% if navLink.href == page.name %}
                    <li class="nav-item active">
                        <a class = "button hvr-underline-from-center nav-link" href="{{ site.baseurl }}/{{ navLink.href }}">
                            {{ navLink.name }} <span class="sr-only">(current)</span>
                        </a>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class = "button hvr-underline-from-center nav-link" href="{{ navLink.href }}">{{ navLink.name }}</a>
                    </li>
                {% endif %}
            {% endfor %}
        </ul>
    </div>
</nav>
